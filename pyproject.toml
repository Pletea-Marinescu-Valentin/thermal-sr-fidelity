[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tsrf"
version = "0.1.0"
description = "Thermal fidelity evaluation for thermal image super-resolution"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.5",
    "opencv-python-headless>=5.0",
    "pillow>=12.3",
    "scipy>=1.14",
]

[project.optional-dependencies]
# PSNR/SSIM/LPIPS, training, evaluation and figures. requirements.txt pins the
# versions the paper used and says where the CUDA build of PyTorch comes from.
full = [
    "torch>=2.11",
    "torchvision>=0.26",
    "lpips>=0.1.4",
    "scikit-image>=0.26",
    "matplotlib>=3.11",
]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
