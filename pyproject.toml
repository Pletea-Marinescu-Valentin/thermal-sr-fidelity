[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tsrf"
version = "0.1.0"
description = "Thermal fidelity evaluation for thermal image super-resolution"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.5",
    "opencv-python-headless>=5.0",
    "pillow>=12.3",
    "scipy>=1.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
